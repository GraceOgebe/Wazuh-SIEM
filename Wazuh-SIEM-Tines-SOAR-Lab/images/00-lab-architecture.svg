<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Wazuh SIEM and Tines SOAR lab architecture</title>
  <desc id="desc">Kali, Windows, and Ubuntu systems send activity and telemetry to the Wazuh server. Wazuh sends alerts to Tines for enrichment, Slack reporting, human approval, and active response back to the affected agent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="wazuh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00a9e5"/>
      <stop offset="1" stop-color="#0575c1"/>
    </linearGradient>
    <linearGradient id="tines" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#34d399"/>
    </marker>
    <style>
      .heading { font: 700 30px Arial, sans-serif; fill: #f8fafc; }
      .subheading { font: 400 16px Arial, sans-serif; fill: #b9c8da; }
      .node-title { font: 700 20px Arial, sans-serif; fill: #f8fafc; }
      .node-text { font: 400 15px Arial, sans-serif; fill: #dce7f3; }
      .small { font: 600 13px Arial, sans-serif; fill: #9fb3c8; letter-spacing: .4px; }
      .flow { font: 600 14px Arial, sans-serif; fill: #dce7f3; }
      .box { stroke: rgba(255,255,255,.18); stroke-width: 1.5; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1400" height="780" rx="28" fill="url(#bg)"/>
  <text x="70" y="62" class="heading">Wazuh SIEM and Tines SOAR Lab Architecture</text>
  <text x="70" y="92" class="subheading">MYDFIR Wazuh Challenge implementation with multi-platform telemetry, enrichment, analyst approval, and containment</text>

  <rect x="55" y="132" width="445" height="540" rx="24" fill="#0b1f35" stroke="#24445f" stroke-width="2"/>
  <text x="82" y="170" class="small">ISOLATED VMWARE LAB  |  192.168.66.0/24</text>

  <rect x="92" y="210" width="365" height="112" rx="18" fill="#202733" class="box"/>
  <circle cx="135" cy="250" r="22" fill="#ef4444" opacity=".9"/>
  <text x="173" y="246" class="node-title">Kali Linux</text>
  <text x="173" y="273" class="node-text">192.168.66.133  |  Test system</text>
  <text x="115" y="304" class="small">CONTROLLED ATTACK SIMULATION</text>

  <rect x="92" y="358" width="365" height="112" rx="18" fill="#1e3a5f" class="box"/>
  <circle cx="135" cy="398" r="22" fill="#38bdf8" opacity=".9"/>
  <text x="173" y="394" class="node-title">Windows 10 Agent</text>
  <text x="173" y="421" class="node-text">192.168.66.131  |  Agent 001</text>
  <text x="115" y="452" class="small">SYSMON + WINDOWS SECURITY EVENTS</text>

  <rect x="92" y="506" width="365" height="112" rx="18" fill="#3a2e18" class="box"/>
  <circle cx="135" cy="546" r="22" fill="#f59e0b" opacity=".95"/>
  <text x="173" y="542" class="node-title">Ubuntu Agent</text>
  <text x="173" y="569" class="node-text">192.168.66.132  |  Agent 002</text>
  <text x="115" y="600" class="small">SSH + AUTHENTICATION + PROCESS LOGS</text>

  <path d="M457 266 C520 266 520 332 585 332" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="476" y="250" class="flow">Test activity</text>
  <path d="M457 414 C520 414 520 370 585 370" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M457 562 C520 562 520 408 585 408" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="472" y="446" class="flow">Endpoint telemetry</text>

  <rect x="585" y="258" width="310" height="240" rx="22" fill="url(#wazuh)" class="box"/>
  <text x="620" y="305" class="small" fill="#e0f2fe">CORE SECURITY PLATFORM</text>
  <text x="620" y="346" class="node-title">Wazuh Server</text>
  <text x="620" y="375" class="node-text">192.168.66.128</text>
  <line x1="620" y1="397" x2="860" y2="397" stroke="#bdeafe" stroke-opacity=".45"/>
  <text x="620" y="426" class="node-text">Manager + Indexer + Dashboard</text>
  <text x="620" y="451" class="node-text">Custom rules + MITRE mapping</text>
  <text x="620" y="476" class="node-text">API + Active Response</text>

  <path d="M895 334 C955 334 955 264 1015 264" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <text x="913" y="306" class="flow">Webhook alert</text>

  <rect x="1015" y="164" width="330" height="230" rx="22" fill="url(#tines)" class="box"/>
  <text x="1050" y="208" class="small" fill="#ede9fe">SOAR ORCHESTRATION</text>
  <text x="1050" y="246" class="node-title">Tines</text>
  <text x="1050" y="279" class="node-text">Alert parsing and IOC extraction</text>
  <text x="1050" y="307" class="node-text">AI-assisted evidence review</text>
  <text x="1050" y="335" class="node-text">Decision logic and approval</text>
  <text x="1050" y="363" class="node-text">Wazuh API response request</text>

  <rect x="1020" y="458" width="150" height="108" rx="18" fill="#153d33" class="box"/>
  <text x="1046" y="499" class="node-title" font-size="18">Threat Intel</text>
  <text x="1046" y="527" class="node-text">VirusTotal</text>
  <text x="1046" y="550" class="node-text">AbuseIPDB</text>

  <rect x="1195" y="458" width="150" height="108" rx="18" fill="#402546" class="box"/>
  <text x="1223" y="499" class="node-title" font-size="18">Slack</text>
  <text x="1223" y="527" class="node-text">SOC report</text>
  <text x="1223" y="550" class="node-text">Analyst review</text>

  <path d="M1095 394 L1095 450" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="1020" y="430" class="flow">IOC enrichment</text>
  <path d="M1245 394 L1260 450" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <text x="1240" y="430" class="flow">Notify</text>

  <rect x="1015" y="616" width="330" height="92" rx="18" fill="#163a2f" class="box"/>
  <text x="1050" y="653" class="node-title">Human Approval</text>
  <text x="1050" y="681" class="node-text">Approve or reject containment</text>
  <path d="M1180 566 L1180 608" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-green)"/>

  <path d="M1015 661 C930 661 930 520 820 520 C730 520 730 548 620 548 C550 548 535 548 470 548" fill="none" stroke="#34d399" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow-green)"/>
  <text x="650" y="590" class="flow">Approved Active Response through Wazuh API</text>

  <rect x="92" y="700" width="1253" height="42" rx="12" fill="#0f2942" stroke="#24445f"/>
  <text x="118" y="727" class="subheading">Flow: simulate activity → collect telemetry → detect and investigate → enrich IOC → notify analyst → approve action → block and verify</text>
</svg>
